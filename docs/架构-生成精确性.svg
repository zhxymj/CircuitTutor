<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#4A5568" stroke-width="1"/>
    </marker>
    <style>
      text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .title { font-size: 14px; font-weight: 500; fill: #1A202C; }
      .body { font-size: 12px; fill: #2D3748; }
      .cap { font-size: 11px; fill: #718096; }
      .box { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 1; rx: 8; }
      .box-llm { fill: #FFF5F5; stroke: #C53030; }
      .box-prec { fill: #EBF8FF; stroke: #2B6CB0; }
      .box-det { fill: #F0FFF4; stroke: #2F855A; }
      .arrow { stroke: #4A5568; stroke-width: 1; fill: none; marker-end: url(#ar); }
    </style>
  </defs>

  <text x="40" y="36" class="title">智绘电路 · 生成精确性分层（LLM 只给意图，物理量由流水线计算）</text>

  <!-- 输入 -->
  <rect x="40" y="56" width="120" height="44" class="box"/>
  <text x="100" y="78" class="body" text-anchor="middle" dominant-baseline="central">中文需求</text>
  <text x="100" y="94" class="cap" text-anchor="middle">输入</text>

  <line x1="160" y1="78" x2="200" y2="78" class="arrow"/>

  <!-- 元件匹配 -->
  <rect x="200" y="56" width="140" height="44" class="box box-det"/>
  <text x="270" y="78" class="body" text-anchor="middle" dominant-baseline="central">本地元件匹配</text>
  <text x="270" y="94" class="cap" text-anchor="middle">0.15ms · 确定性</text>

  <line x1="340" y1="78" x2="380" y2="78" class="arrow"/>

  <!-- LLM -->
  <rect x="380" y="56" width="220" height="44" class="box box-llm"/>
  <text x="490" y="78" class="body" text-anchor="middle" dominant-baseline="central">LLM：规划 + 结构化生成</text>
  <text x="490" y="94" class="cap" text-anchor="middle">概率性 · 引脚白名单约束</text>

  <line x1="490" y1="100" x2="490" y2="130" class="arrow"/>

  <!-- 结构校验 -->
  <rect x="380" y="130" width="220" height="40" class="box box-det"/>
  <text x="490" y="150" class="body" text-anchor="middle" dominant-baseline="central">结构校验 → 回灌修复</text>

  <line x1="490" y1="170" x2="490" y2="200" class="arrow"/>

  <!-- ERC -->
  <rect x="380" y="200" width="220" height="40" class="box box-det"/>
  <text x="490" y="220" class="body" text-anchor="middle" dominant-baseline="central">33 个 ERC 检查器 + 警告 autofix</text>

  <line x1="490" y1="240" x2="490" y2="272" class="arrow"/>

  <!-- Precision layer (highlight) -->
  <rect x="40" y="272" width="600" height="88" rx="10" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="56" y="294" class="body" font-weight="600" fill="#2B6CB0">④ 参数精确化 + 拓扑黄金模式（本次增强 · boardsmith 式）</text>

  <rect x="56" y="308" width="270" height="36" class="box box-prec"/>
  <text x="191" y="326" class="body" text-anchor="middle" dominant-baseline="central">R = (Vcc − Vf) / 10mA → E12</text>

  <rect x="342" y="308" width="280" height="36" class="box box-prec"/>
  <text x="482" y="326" class="body" text-anchor="middle" dominant-baseline="central">拓扑：LED 串 R · 555 OUT→R→LED · 运放反馈</text>

  <text x="56" y="354" class="cap">只改无争议标量；用户已写明且安全的值保留；拓扑只告警不改线；幂等可重放</text>

  <line x1="340" y1="360" x2="340" y2="392" class="arrow"/>

  <!-- 输出 -->
  <rect x="160" y="392" width="360" height="44" class="box box-det"/>
  <text x="340" y="414" class="body" text-anchor="middle" dominant-baseline="central">可交互 SVG 原理图 + KiCad 9 工程</text>
  <text x="340" y="430" class="cap" text-anchor="middle">官方 ERC 0 违规 · 网表逐网络一致</text>

  <!-- 脚注 -->
  <text x="40" y="470" class="cap">参考：ForestHubAI/boardsmith（计算值）· eelab-dev/EEschematic（子结构）· Shaurya-Sethi/circuitron（ERC 闭环）</text>
  <text x="40" y="488" class="cap">5V 红光 LED → 330Ω　|　12V 红光 → 1kΩ　|　3.3V 红光 → 120Ω（E12 吸附）</text>
</svg>
